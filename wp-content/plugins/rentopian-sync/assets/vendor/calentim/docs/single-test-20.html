<!DOCTYPE  html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
        <title>
            calentim - Date Range Picker
        </title>

        <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,400i,500,700" rel="stylesheet"/>
        <link href="../build/css/calentim.min.css" rel="stylesheet"/>
        <link href="http://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet"/>
        <script src="../build/vendor/jquery.min.js"></script>
        <script src="../build/vendor/moment.min.js"></script>
        <script src="../build/vendor/jquery.hammer.js"></script>
        <script src="../build/js/calentim.min.js"></script>
        <style>
            html {
                background:#00c2d5;
                padding: 0;
                margin: 0;
                box-sizing: border-box;
                display: flex;
                align-items:center;
                justify-content: center;
                height: 100%;
                width: 100%;
            }
            body {
                width: 1000px !important;
                text-align: center;
                flex-basis: 1000px;
                flex-shrink: 0;
            }
        </style>
    </head>
    <body>
        <input type="text" id="fl-item-9" style="width: 400px" />
    <script type="text/javascript">
    var calentim = null;
    $("#fl-item-9").calentim({
        showCalendars: false,
        format: 'LT',
        oninit: function (instance) {
            instance.config.startDate = moment([2020, 1, 28]).hour(8).minute(30);
            instance.config.endDate = moment([2020, 1, 28]).hour(8).minute(30);
            instance.refreshValues();
            console.log(instance.config.startDate.inspect());
            console.log(instance.config.endDate.inspect());
            calentim = instance;
        },
        ontimechange: function (calentim, startDate, endDate) {
            console.log(startDate.format('LLLL'));
            console.log(endDate.format('LLLL'));
        }
    });

    </script>
    </body>
</html>
