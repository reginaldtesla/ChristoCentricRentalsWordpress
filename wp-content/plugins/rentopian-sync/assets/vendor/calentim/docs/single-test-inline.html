<!DOCTYPE  html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
        <title>
            calentim - Date Range Picker
        </title>

        <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,400i,500,700" rel="stylesheet"/>
        <link href="../build/css/calentim.min.css" rel="stylesheet"/>
        <link href="http://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet"/>
        <script src="../build/vendor/jquery.min.js"></script>
        <script src="../build/vendor/moment.min.js"></script>
        <script src="../build/vendor/jquery.hammer.js"></script>
        <script src="../build/js/calentim.min.js"></script>
        <style>
            html {
                background: #0C0A20;
                padding: 0;
                margin: 0;
                box-sizing: border-box;
                display: flex;
                align-items:center;
                justify-content: center;
                height: 100%;
                width: 100%;
            }
        </style>
    </head>
    <body>
        <input class="calentim" tabindex="0" autocomplete="off" type="input" data-plugin-options='{"inline": true, "showWeekNumbers": true, "rangeOrientation": "horizontal"}'  placeholder="" value="" />
        <input class="calentim" tabindex="0" autocomplete="off" type="input" data-plugin-options='{"inline": true, "showWeekNumbers": true, "rangeOrientation": "vertical"}'  placeholder="" value="" />
        <input class="calentim" tabindex="0" autocomplete="off" type="input" data-plugin-options='{"inline": false, "showWeekNumbers": true, "rangeOrientation": "vertical"}'  placeholder="" value="" />
        <input class="calentim" tabindex="0" autocomplete="off" type="input" data-plugin-options='{"inline": false, "showWeekNumbers": true, "rangeOrientation": "horizontal", "showButtons": true}'  placeholder="" value="" />
        <input class="calentim" tabindex="0" autocomplete="off" type="input" data-plugin-options='{"inline": false, "showWeekNumbers": true, "rangeOrientation": "horizontal"}'  placeholder="" value="" />
    <script type="text/javascript">
        $(".calentim").calentim();
    </script>
    </body>
</html>
